<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>trabalho leandro</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<a-scene>
    <!-- Camera -->
    <a-entity position="-2 -0.2 1.9" rotation="0 -60 0">
        <a-camera></a-camera>
    </a-entity>
    <!-- caixa -->
    <a-box position="0 0.5 0" width="2.9" height="0.6" depth="2.4" color="#8B5A2B"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSULgfB-I13jpET188znbeid9taIwGpfkYkbw&s">

        <!-- fechadura -->
        <a-plane position="0 0.2 1.22" width="0.3" height="0.2" color="yellow">     
    </a-box>
    <!-- PAREDES -->

    <!-- parede trás -->
    <a-plane position="0 5 -10" width="20" height="10" src="https://adesivo.com.br/cdn/shop/products/papel-de-parede-adesivo-madeira-rustica-horizontal-n010038-645915_576x.jpg?v=1643342536"></a-plane>

    <!-- parede frente -->
    <a-plane position="0 5 10" rotation="0 180 0" width="20" height="10" src="https://adesivo.com.br/cdn/shop/products/papel-de-parede-adesivo-madeira-rustica-horizontal-n010038-645915_576x.jpg?v=1643342536"></a-plane>

    <!-- parede esquerda -->
    <a-plane position="-10 5 0" rotation="0 90 0" width="20" height="10" src="https://adesivo.com.br/cdn/shop/products/papel-de-parede-adesivo-madeira-rustica-horizontal-n010038-645915_576x.jpg?v=1643342536"></a-plane>

    <!-- parede direita -->
    <a-plane position="10 5 0" rotation="0 -90 0" width="20" height="10" src="https://adesivo.com.br/cdn/shop/products/papel-de-parede-adesivo-madeira-rustica-horizontal-n010038-645915_576x.jpg?v=1643342536"></a-plane>

    <!-- telhado -->
    <a-plane position="0 10 0" rotation="90 0 0" width="20" height="20" color="#000"></a-plane>


    <!-- tampa com dobradiça -->
    <a-entity position="0 1.6 -1.5"
        animation="property: rotation; from: 270 0 0; to: 230 0 0; dur: 5000; easing: easeInOutQuad">
        <!-- tampa fundo -->
        <a-box position="0 -1.2 0" width="2.9" height="3" depth="0.1" color="#8B5A2B"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSULgfB-I13jpET188znbeid9taIwGpfkYkbw&s">
            <!-- base inferior -->
            <a-box position="0 1.5 -0.42" rotation="90 0 0" width="2.9" height="0.85" depth="0.021" color="#8B5A2B"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSULgfB-I13jpET188znbeid9taIwGpfkYkbw&s">
            </a-box>

            <!-- base superior -->
            <a-box position="0 -1.5 -0.45" rotation="90 0 0" width="2.9" height="0.8" depth="0.021" color="#8B5A2B"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSULgfB-I13jpET188znbeid9taIwGpfkYkbw&s">

                <!--fechadura-->
                <a-plane position="0 -0.3 0.015" width="0.3" height="0.2" color="yellow"></a-plane>
            </a-box>
            <!-- lateral D -->
            <a-box position="-1.45 -0.001 -0.45" rotation="0 90 0" width="0.8" height="3" depth="0.021" color="#8B5A2B"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSULgfB-I13jpET188znbeid9taIwGpfkYkbw&s">
            </a-box>
            <!-- lateral E -->
            <a-box position="1.45 -0.001 -0.45" rotation="0 90 0" width="0.8" height="3" depth="0.021" color="#8B5A2B"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSULgfB-I13jpET188znbeid9taIwGpfkYkbw&s">
            </a-box>
        </a-box>
    </a-entity>



    <!-- base disco-->
    <a-cylinder position="-0.4 0.85 0.2" radius="1" height="0.05" color="#333">
    </a-cylinder>



    <!-- disco girando -->
    <a-cylinder id="disco" position="-0.4 0.9 0.2" radius="1" height="0.02"
        src="https://capricho.abril.com.br/wp-content/uploads/2016/07/nirvana-in-utero-20anos44016.jpg?quality=7…%22"
        animation=" property: rotation; to: 0 360 0; dur: 3000; loop: true; startEvents: girar">
        <!-- treco que encaixa disco -->
        <a-cylinder position="0 0.01 0" radius="0.1" height="0.021" color="Black"></a-cylinder>
    </a-cylinder>
    <!--botao volume-->
    <a-cylinder position="0.9 0.82 0.7" radius="0.09" height="0.21" color="black">
    </a-cylinder>
    <!--suporte agulha-->
    <a-box position=" 0.9 0.9 -0.1" width="0.32" height="0.39" depth="0.3" color="#111"></a-box>



    <!-- agulha-->
    <a-entity position="0.8 1 -0.1">

        <a-entity id="agulha" rotation="0 0 0"
            animation="property: rotation; to: 93 -50 5; dur: 6000; easing: easeInOutQuad">

            <a-box position="0 0.5 0" width="0.05" height="1" depth="0.05" color="gray">
                <a-box position="0 0.525 0" height="0.05" depth="0.05" width="0.05" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTkUz_kLoEjVfiXhoijcgcEArspIKWoobeYuA&s"></a-plane>
            </a-box>

        </a-entity>

    </a-entity>






    <!--detalhe caixa-->
    <a-box position="-0.81 0.5 1.2" width="0.6" height="0.3" depth="0.05"
        src="https://img.pikbest.com/wp/202344/metal-texture-black-abstract-metallic-background-with-speaker-grill_9925225.jpg!w700wp"></a-box>
    <a-box position="0.81 0.5 1.2" width="0.6" height="0.3" depth="0.05 "
        src="https://img.pikbest.com/wp/202344/metal-texture-black-abstract-metallic-background-with-speaker-grill_9925225.jpg!w700wp"></a-box>
    <!-- alca -->
    <a-torus position="0 0.4 1.1" radius="0.35" radius-tubular="0.05" rotation="90 0 0" color="black">
    </a-torus>

    
    <a-plane rotation="-90 0 0" width="20" height="20"
    src="https://images.rawpixel.com/image_800/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDIyLTA1L3BmLXMxMjUtYWtlNzAwNS1hLmpwZw.jpg"></a-plane>

    </a-box>
</a-scene>



<script>
    const agulha = document.querySelector('#agulha');
    const disco = document.querySelector('#disco');

    agulha.addEventListener('animationcomplete', () => {
        disco.emit('girar');
    });
</script>
</body>

</html>
